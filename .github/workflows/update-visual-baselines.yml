name: Update Visual Regression Baselines
# Manual-only (workflow_dispatch) — regenerates tests/visual/**/*-snapshots/ on
# ubuntu-latest (matching Playwright Tests' runner) and uploads the resulting PNGs
# as a build artifact for download and commit. See README: Visual Regression Testing.
#
# Does NOT commit automatically — download the artifact, review the images, and
# commit them yourself. This intentionally stays a manual step rather than an
# auto-committing bot, so a baseline never changes without a human looking at it.
on:
  workflow_dispatch:
jobs:
  update-baselines:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Regenerate visual regression baselines
      run: npx playwright test tests/visual --project=chromium --update-snapshots
    - uses: actions/upload-artifact@v4
      with:
        name: visual-baselines-linux
        path: tests/visual/**/*-snapshots/**
        retention-days: 7
