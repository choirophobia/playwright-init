name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 06:00 WIB (UTC+7) daily = 23:00 UTC the previous day
    - cron: '0 23 * * *'
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    # Fails fast on a real type error before spending time installing browsers and
    # running the suite. See README: Continuous Integration.
    - name: Type-check
      run: npm run typecheck
    # Playwright browser binaries (~500MB) are cached separately from npm packages,
    # keyed on package-lock.json so a Playwright version bump invalidates the cache.
    # See README: Continuous Integration.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
    - name: Install Playwright OS dependencies (browsers cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps
    - name: Generate BDD tests from .feature files
      run: npx bddgen
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Notify Discord
      if: always()
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        JOB_STATUS: ${{ job.status }}
        BRANCH: ${{ github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ "$JOB_STATUS" = "success" ]; then
          COLOR=3066993
          TITLE="✅ Playwright Tests passed"
        else
          COLOR=15158332
          TITLE="❌ Playwright Tests failed"
        fi
        PAYLOAD=$(jq -n \
          --arg title "$TITLE" \
          --arg branch "$BRANCH" \
          --arg url "$RUN_URL" \
          --argjson color "$COLOR" \
          '{embeds: [{title: $title, description: ("Branch: `" + $branch + "`\nRun: " + $url), color: $color}]}')
        curl -sfS -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK" -d "$PAYLOAD"
